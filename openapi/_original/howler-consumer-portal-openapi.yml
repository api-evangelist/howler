        passport_number:
          type:
          - string
          - 'null'
          description: Passport Number
        passport_country:
          type:
          - string
          - 'null'
          description: Passport Country
        email_confirmed?:
          type: boolean
          description: Email has been confirmed
        avatar_url:
          type:
          - string
          - 'null'
          description: Avatar URL
        required_fields:
