  "/password/reset":
    post:
      summary: Reset Password
      tags:
      - Basic Authentication
      security: []
      operationId: resetPassword
      parameters: []
      description: 'Requests a password reset email to be sent to the provided email
        address

        '
      responses:
        '201':
          description: Password reset request for non-existent email
          content:
            application/json:
              examples:
                Successful password reset request:
                  value:
                    status: success
                    message: Password reset instructions have been sent to your email
                Non-existent email (still returns success):
                  value:
                    status: success
                    message: If your email exists in our system, password reset instructions
                      have been sent
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                required:
                - status
                - message
        '422':
          description: Invalid email format
          content:
            application/json:
              examples:
                Missing email parameter:
                  value:
                    status: 422
                    error: Email is required
                Missing user parameter:
                  value:
                    status: 422
                    error: Request must include a "user" object with an "email" field
                Invalid email format:
                  value:
                    status: 422
                    error: Invalid email format
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                required:
                - status
                - error
        '500':
          description: Server error during email delivery
          content:
            application/json:
              examples:
                Server error:
                  value:
                    status: 500
                    error: Failed to process password reset request
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                required:
                - status
                - error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                  required:
                  - email
              required:
              - user
            examples:
              Password reset request:
                summary: Valid password reset request
                value:
                  user:
                    email: test@example.com
        required: true
  "/register":
    post:
      summary: User Registration
      tags:
      - Basic Authentication
      security: []
      operationId: registerUser
      parameters: []
      description: 'Creates a new user account and returns the user data

        '
      responses:
        '201':
          description: User created and merged with dummy user
          content:
            application/json:
              examples:
                Successful registration:
                  value:
                    user:
                      id: 1
                      first_name: John
                      last_name: Doe
                      primary_email: new_user@howler.co.za
                      dummy?: false
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      primary_email:
                        type: string
                      dummy?:
                        type: boolean
                    required:
                    - id
                    - primary_email
                    - first_name
                    - last_name
                    - primary_email
                    - dummy?
                required:
                - user
        '422':
          description: Invalid registration data
          content:
            application/json:
              examples:
                Invalid registration data:
                  value:
                    status: 422
                    message: Registration failed.
                    errors:
                      email:
                      - is invalid
                      password:
                      - is too short (minimum is 8 characters)
                      password_confirmation:
                      - doesn't match Password
                      cellphone_number:
                      - is invalid
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                required:
                - status
                - message
                - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    cellphone_number:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                  required:
                  - email
                  - password
                  - password_confirmation
                  - cellphone_number
                  - first_name
                  - last_name
              required:
              - user
            examples:
              Registration request:
                summary: Valid registration request
                value:
                  user:
                    email: new_user@howler.co.za
                    password: password123
                    password_confirmation: password123
        required: true
