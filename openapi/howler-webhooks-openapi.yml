openapi: 3.1.0
info:
  title: Howler Webhooks v1
  version: 1.2.0
  description: |
    *Last updated: 2024-07-18 11:57:00 +0200*

    # Introduction

    The **Howler Webhooks v1** describes the webhooks which can be sent to *Howler* partners for specific events.

    The location to wich the webbooks are sent need to be configured by an authorised user with the correct access.
