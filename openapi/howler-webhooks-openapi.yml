tags:
- name: Webhooks
webhooks:
  Ticket Webhook:
    post:
      summary: Sent when a ticket is created, amended or cancelled.
      tags:
      - Webhooks
      description: "Send ticket information to an external server.\n\nThis webhook
        is triggered when a ticket is \n"
      security: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ticket"
  Event Webhook:
    post:
      summary: Sent when an event is created or amended.
      tags:
      - Webhooks
      description: |
        Send event information to an external server.

        This webhook is triggered when an event is created or when an event is updated.
        Currently there is a known issue where the webhook is not triggered when a new ticket type is created or updated.
      security: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Event"
  Payment Webhook:
    post:
      summary: Sent when a payment's status changes to successful.
      tags:
      - Webhooks
      description: |
        Send payment information to an external server.

        This webhook is trigger when a payment's status is updated to successful.
      security: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Payment"
