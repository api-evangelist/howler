aid: howler
name: Howler
description: >-
  Howler is a South African event technology platform that consolidates ticketing, RFID cashless
  payments, and vendor and access-control management into a single system for event organisers and
  attendees. Founded out of the Barclays Accelerator powered by Techstars (2017) and Techstars-backed,
  Howler has processed over R1.5 billion in transactions across thousands of events. Its public Howler
  API v3 consumer portal exposes 67 operations for authentication (OAuth2, JWT, email OTP, third-party
  OAuth), tickets (buy, assign, transfer), cashless RFID tags, top-ups, and cashout to bank accounts,
  and a Howler Webhooks v1 surface pushes ticket, event, and payment events to partner endpoints.
